[project]
name = "dnd-spell-cards"
version = "0.1.0"
description = "Generate printable MTG-sized A4 sheets of D&D 5e spell cards from a JSON dataset."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.63.0",
    "jsonschema>=4.26.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]
